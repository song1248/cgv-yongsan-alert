name: CGV Watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      testNotification:
        description: "Create a test GitHub Issue without waiting for CGV changes"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      baselineOnly:
        description: "Update state without creating notification issues"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  issues: write

concurrency:
  group: cgv-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check CGV availability
        run: npm run watch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TEST_NOTIFICATION: ${{ inputs.testNotification || 'false' }}
          BASELINE_ONLY: ${{ inputs.baselineOnly || 'false' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || vars.EMAIL_FROM }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS || vars.EMAIL_RECIPIENTS }}

      - name: Commit state
        run: |
          if git diff --quiet -- data/state.json; then
            echo "No state changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/state.json
            git commit -m "chore: update cgv watcher state"
            git push
          fi
