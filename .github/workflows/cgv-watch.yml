name: CGV Watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      testNotification:
        description: "Create a test GitHub Issue without waiting for CGV changes"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      baselineOnly:
        description: "Update state without creating notification issues"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  issues: write

concurrency:
  group: cgv-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest state
        run: git pull --ff-only origin main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check CGV availability
        run: npm run watch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TEST_NOTIFICATION: ${{ inputs.testNotification || 'false' }}
          BASELINE_ONLY: ${{ inputs.baselineOnly || 'false' }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER || vars.EMAIL_PROVIDER }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || vars.EMAIL_FROM }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS || vars.EMAIL_RECIPIENTS }}
          TEST_EMAIL_RECIPIENTS: ${{ secrets.TEST_EMAIL_RECIPIENTS || vars.TEST_EMAIL_RECIPIENTS }}
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
          KAKAO_ENABLED: ${{ secrets.KAKAO_ENABLED || vars.KAKAO_ENABLED }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_ACCESS_TOKEN: ${{ secrets.KAKAO_ACCESS_TOKEN }}
          KAKAO_RECEIVER_UUIDS: ${{ secrets.KAKAO_RECEIVER_UUIDS }}
          KAKAO_SEND_TO_ME: ${{ secrets.KAKAO_SEND_TO_ME || vars.KAKAO_SEND_TO_ME }}

      - name: Commit state
        run: |
          if git diff --quiet -- data/state.json; then
            echo "No state changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/state.json
            git commit -m "chore: update cgv watcher state"
            git pull --rebase origin main
            git push
          fi
